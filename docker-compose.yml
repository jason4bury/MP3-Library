# MP3 Library. Copy .env.example to .env next to this file, fill it in, then run:
#   docker compose up -d
# Every ${VALUE} below comes from that .env, so .env is normally the only file you edit.
services:

  mp3-library:
    image: jason4bury/mp3-library:${MP3_LIBRARY_TAG:-latest}
    container_name: mp3-library
    # Passes the app settings in .env (sign-in, Last.fm, MUSIC_DIR) to the container.
    env_file:
      - .env
    # Fixed container-side values. These override anything with the same name in .env.
    environment:
      PORT: 3000
      ARTIST_PICTURES_DIR: /artist-pictures
      DATA_DIR: /data
    volumes:
      # Database, cover art cache and sessions. A named Docker volume unless DATA_HOST_DIR is set.
      - ${DATA_HOST_DIR:-mp3-library-data}:/data
      # Music and artist pictures are read-only: the app never writes to them.
      - ${MUSIC_HOST_DIR_1:?Set MUSIC_HOST_DIR_1 in .env to your music folder}:/music/collection1:ro
      # A second music folder? Remove the # below, set MUSIC_HOST_DIR_2 in .env and add
      # /music/collection2 to MUSIC_DIR.
      # - ${MUSIC_HOST_DIR_2}:/music/collection2:ro
      - ${ARTIST_PICTURES_HOST_DIR:?Set ARTIST_PICTURES_HOST_DIR in .env to your artist pictures folder}:/artist-pictures:ro
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  mp3-library-data:

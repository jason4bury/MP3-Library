services:

  mp3-library:
    image: jason4bury/mp3-library
    container_name: mp3-library
    labels:
      - home.group=Music
    # App settings come from E:\Docker_PC\env\mp3-library\.env: MUSIC_DIR, APP_USERNAME,
    # APP_PASSWORD, SESSION_SECRET, LASTFM_API_KEY, LASTFM_API_SECRET.
    env_file:
      - ${ENV}/mp3-library/.env
    # Fixed container-side values. These override anything with the same name in the
    # .env file.
    environment:
      PORT: 3000
      ARTIST_PICTURES_DIR: /artist-pictures
      DATA_DIR: /data
    volumes:
      # Database, cover art cache and sessions.
      - ${CONFIGS}/mp3-library:/data
      # Music and artist pictures are read-only: the app never writes to them.
      # Only one music folder? Delete the collection2 line and set
      # MUSIC_DIR=/music/collection1 in the app's .env.
      - ${MUSIC}/main:/music/collection1:ro
      - ${MUSIC}/soundtracks:/music/collection2:ro
      - ${MP3_ARTIST_PICS}:/artist-pictures:ro
    ports:
      - 3000:3000
    restart: unless-stopped

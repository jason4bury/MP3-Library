# MP3 Library
# 1. Change the two folder paths under "volumes" to your own folders.
# 2. Copy .env.example to .env next to this file and fill in the sign-in settings.
# 3. Run: docker compose up -d   then open http://<your-server>:3000
services:

  mp3-library:
    image: jason4bury/mp3-library:latest
    container_name: mp3-library
    # App settings (sign-in, Last.fm, MUSIC_DIR) come from .env.
    env_file:
      - .env
    # Fixed container-side values. These override anything with the same name in .env.
    environment:
      PORT: 3000
      ARTIST_PICTURES_DIR: /artist-pictures
      DATA_DIR: /data
    volumes:
      # Database, cover art cache and sessions, in a Docker volume. To keep them in a folder
      # instead, replace mp3-library-data with a path such as D:/Docker/mp3-library.
      - mp3-library-data:/data
      # Your music folder. Read-only: the app never writes to it.
      # Windows: D:/Music   Linux/NAS: /volume1/music
      - /path/to/music:/music/collection1:ro
      # A second music folder? Remove the # below, change the path, and set
      # MUSIC_DIR=/music/collection1,/music/collection2 in .env.
      # - /path/to/more-music:/music/collection2:ro
      # Artist pictures, one subfolder per artist (Artist Pictures/Radiohead/folder.jpg).
      - /path/to/artist-pictures:/artist-pictures:ro
    ports:
      # Change the first number to use a different port on the host.
      - "3000:3000"
    restart: unless-stopped

volumes:
  mp3-library-data:
